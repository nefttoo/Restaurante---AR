
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marea Carreta de Barrio</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 24px 12px 8px;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      background: #eeeeee;
    }

    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Marea Carreta de Barrio</h1>
  <p>Explora nuestro restaurante en 3D</p>

  <model-viewer
    src="./Marea%20carreta%20de%20barrio.glb"
    alt="Modelo tridimensional del restaurante"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    exposure="1">

    <button slot="ar-button">
      Ver en realidad aumentada
    </button>

  </model-viewer>
</body>
</html>
